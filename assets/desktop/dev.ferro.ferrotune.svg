<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Ferrotune icon: original artwork (MIT, same as the code). A rust-red
       tile ("ferro" = iron) with a tuning fork whose tines become a
       waveform. Deliberately unlike any streaming service's logo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4622a"/>
      <stop offset="1" stop-color="#7a2a12"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g fill="none" stroke="#fff4ec" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- tuning fork -->
    <path d="M100 52 V128 a28 28 0 0 0 56 0 V52"/>
    <path d="M128 156 V208"/>
  </g>
  <g fill="#fff4ec">
    <!-- waveform bars to the sides -->
    <rect x="52" y="104" width="14" height="48" rx="7"/>
    <rect x="190" y="92" width="14" height="72" rx="7"/>
  </g>
</svg>
